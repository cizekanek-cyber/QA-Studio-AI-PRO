name: QA Studio release checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate auth, UI modules and release links
        run: node --test tests/qa-release.test.cjs
      - name: Build Cloudflare Pages output (without provider secrets)
        run: node scripts/build-cloudflare.cjs
      - name: Verify deploy assets and route security
        run: node --test tests/qa-cloudflare.test.cjs
