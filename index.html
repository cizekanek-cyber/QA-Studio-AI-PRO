<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090c19">
<meta name="description" content="QA Studio AI PRO: grafika, krátká videa, luxusní a vánoční motivy a 200 zvířecích AI scén.">
<title>QA Studio AI PRO</title>
<style>
html,body{width:100%;height:100%;margin:0;background:#090c19;color:#fff}
#app{display:block;border:0;width:100%;height:100%;height:100dvh}
#notice{position:fixed;z-index:9;inset:0;background:#090c19;color:#fff;display:grid;place-items:center;font:15px system-ui;text-align:center;padding:20px}
</style>
</head>
<body>
<div id="notice">Načítám QA Studio AI PRO…</div>
<iframe id="app" src="./index-1.html" title="QA Studio AI PRO"></iframe>
<script>
(function(){
'use strict';
const f=document.getElementById('app'),n=document.getElementById('notice');
if(location.search||location.hash)f.src='./index-1.html'+location.search+location.hash;
f.addEventListener('load',function(){
 try{
   const doc=f.contentDocument;
   if(!doc||!doc.querySelector('.nav'))throw Error('Aplikace nebyla načtena.');
   if(!doc.querySelector('script[data-qa-animals]')){
     const script=doc.createElement('script');
     script.src='./qa-animals.js?v=20261123-scenes5';
     script.dataset.qaAnimals='true';
     script.onerror=function(){console.warn('Doplněk zvířecích šablon se nenačetl.')};
     doc.body.append(script);
   }
   if(!doc.querySelector('script[data-qa-account]')){
     const account=doc.createElement('script');
     account.src='./qa-account.js?v=20261123-auth2';
     account.dataset.qaAccount='true';
     doc.body.append(account);
   }
   n.style.display='none';
 }catch(e){
   n.textContent='Studio se nepodařilo načíst v tomto prostředí. Otevři soubor index-1.html přímo z webového serveru.';
   console.error(e);
 }
});
})();
</script>
</body>
</html>
