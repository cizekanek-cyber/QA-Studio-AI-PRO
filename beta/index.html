<iframe id="app" src="../index-1.html?v=pricing-20261123-4" title="QA Studio AI PRO – zkušební verze" allow="web-share"></iframe>
<div id="notice">Loading QA Studio AI PRO preview…</div>
<script>
(function(){
'use strict';
const frame=document.getElementById('app'),notice=document.getElementById('notice');
if(location.search||location.hash)frame.src='../index-1.html?v=pricing-20261123-4'+(location.search?'&'+location.search.slice(1):'')+location.hash;
document.getElementById('openAccount').onclick=()=>{
 const tab=frame.contentDocument?.querySelector('.nav button[data-tab="qaAccountPanel"]');
 if(tab){tab.click();frame.focus()}else{alert('Přihlašování se zatím načítá.')}
};
frame.onload=()=>{
 try{
 const doc=frame.contentDocument;
   if(doc&&!doc.getElementById('qaObsidianDesign')){const design=doc.createElement('link');design.id='qaObsidianDesign';design.rel='stylesheet';design.href='./qa-design.css?v=20261125-obsidian2';doc.head.append(design);}
 if(!doc||!doc.querySelector('.nav'))throw Error('Editor se nenačetl.');
 for(const [path,key] of [['./qa-animals.js','qaAnimals'],['./qa-account.js','qaAccount']]){
  if(doc.querySelector('script[data-'+(key==='qaAnimals'?'qa-animals':'qa-account')+']'))continue;
  const s=doc.createElement('script');s.src=path+(key==='qaAnimals'?'?v=20261123-unique9':'?v=20261123-auth6');
  if(key==='qaAnimals')s.dataset.qaAnimals='true';else s.dataset.qaAccount='true';
  s.onerror=()=>console.error('Doplněk není k dispozici: '+path);
  doc.body.append(s);
 }
 if(!doc.querySelector('script[data-qa-social]')){const social=doc.createElement('script');social.src='./qa-social.js?v=20261123-social1';social.dataset.qaSocial='true';doc.body.append(social);}
 if(!doc.querySelector('script[data-qa-plans]')){const plans=doc.createElement('script');plans.src='./qa-plans.js?v=20261123-plans3';plans.dataset.qaPlans='true';doc.body.append(plans);}
 if(!doc.querySelector('script[data-qa-cutouts]')){const cutouts=doc.createElement('script');cutouts.src='./qa-cutouts.js?v=20261125-cutouts2';cutouts.dataset.qaCutouts='true';doc.body.append(cutouts);}
 if(!doc.querySelector('script[data-qa-start]')){const start=doc.createElement('script');start.src='./qa-start.js?v=20261123-start2';start.dataset.qaStart='true';doc.body.append(start);}
 if(!doc.querySelector('script[data-qa-pricing-fix]')){const pricing=doc.createElement('script');pricing.src='./qa-pricing-fix.js?v=20261123-v4';pricing.dataset.qaPricingFix='true';pricing.onerror=()=>console.error('Ceník se nepodařilo aktualizovat');doc.body.append(pricing);}
 if(!doc.querySelector('script[data-qa-i18n]')){const i18n=doc.createElement('script');i18n.src='./qa-i18n.js?v=20261123-i18n2';i18n.dataset.qaI18n='true';doc.body.append(i18n);}
 notice.style.display='none';
 }catch(e){notice.textContent='Beta verzi se nepodařilo načíst. Původní aplikace zůstává nedotčena.';console.error(e)}
};
})();
</script><script>
if('serviceWorker' in navigator && location.protocol==='https:') {
 window.addEventListener('load',()=>navigator.serviceWorker.register('../sw.js',{scope:'/QA-Studio-AI-PRO/'}).catch(()=>{}),{once:true});
}
</script>
